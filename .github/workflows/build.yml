      - name: Debug build setup
        run: |
          echo "=== BASE RULES ==="
          sed -n '1,160p' "$PS3DEV/base_rules"
          echo "=== SOURCE FILES ==="
          find src -maxdepth 2 -type f -print
          echo "=== MAKE VARIABLES ==="
          make -C src -pn | grep -E '^(SOURCES|CFILES|CXXFILES|OBJS|OFILES|TARGET) *[:?+]?=' || true