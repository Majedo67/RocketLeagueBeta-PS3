name: Build RocketLeagueBeta PS3 PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl make git

      - name: Download PS3 toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz | tar -xz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PORTLIBS=$GITHUB_WORKSPACE/ps3dev/portlibs/ppu" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Install Tiny3D graphics library
        run: |
          git clone --depth 1 https://github.com/wargio/tiny3D.git "$GITHUB_WORKSPACE/tiny3D"
          make -C "$GITHUB_WORKSPACE/tiny3D/lib" install
          test -f "$PORTLIBS/include/tiny3d.h"
          test -f "$PORTLIBS/lib/libtiny3d.a"

      - name: Verify sources and toolchain
        run: |
          command -v ppu-g++
          ppu-g++ --version
          test -f "$PSL1GHT/ppu_rules"
          find src -maxdepth 3 -type f -print

      - name: Build installable package
        run: make -C src VERBOSE=1 RocketLeagueBeta.pkg

      - name: Verify package
        run: |
          test -s src/RocketLeagueBeta.pkg
          file src/RocketLeagueBeta.pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RocketLeagueBeta-PS3-PKG
          path: src/RocketLeagueBeta.pkg
          if-no-files-found: error
