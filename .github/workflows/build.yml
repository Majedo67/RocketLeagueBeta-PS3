name: Build RocketLeagueBeta PS3 PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl make

      - name: Download PS3 toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz \
            | tar -xz -C "$GITHUB_WORKSPACE"

          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"

      - name: Build PKG
        run: |
          make -C src RocketLeagueBeta.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: RocketLeagueBeta-PKG
          path: src/RocketLeagueBeta.pkg
          if-no-files-found: error