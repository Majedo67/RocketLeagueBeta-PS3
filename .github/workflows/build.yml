name: Inspect PSL1GHT Files

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz \
            | tar -xz -C "$GITHUB_WORKSPACE"

          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"

      - name: Find required files
        run: |
          echo "=== TOOLCHAIN ROOT ==="
          ls -la "$PS3DEV"

          echo "=== BUILD RULE FILES ==="
          find "$PS3DEV" -type f \( \
            -name 'base_rules' -o \
            -name 'data_rules' -o \
            -name 'ppu_rules' \
          \)

          echo "=== PSL1GHT DIRECTORIES ==="
          find "$PS3DEV" -maxdepth 3 -type d