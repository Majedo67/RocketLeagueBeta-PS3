name: Inspect PS3 Build Rules

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PS3 toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz \
            | tar -xz -C "$GITHUB_WORKSPACE"

          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"

      - name: Inspect build rules
        run: |
          echo "=== PPU RULES ==="
          sed -n '1,200p' "$PS3DEV/ppu_rules"

          echo "=== SRC MAKEFILE ==="
          cat src/Makefile

          echo "=== TOOLCHAIN FILES ==="
          find "$PS3DEV" -name 'ppu_rules' -o -name 'Makefile'